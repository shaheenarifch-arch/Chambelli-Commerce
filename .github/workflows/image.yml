# Builds the Chambelli app image on GitHub (not on the 1 GB VM) and publishes it to
# GitHub Container Registry. deploy/vm-install.sh then only downloads it.
# Image: ghcr.io/shaheenarifch-arch/chambelli-commerce:latest (also tagged with the commit SHA)
# Help: docs/DEPLOY.md and https://docs.github.com/packages/working-with-a-github-packages-registry/working-with-the-container-registry
name: image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-main
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shaheenarifch-arch/chambelli-commerce:latest
            ghcr.io/shaheenarifch-arch/chambelli-commerce:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
