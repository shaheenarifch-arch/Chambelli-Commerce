services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: chambelli
      POSTGRES_PASSWORD: chambelli
      POSTGRES_DB: chambelli
    ports: ["5432:5432"]
    volumes: [commerce_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chambelli"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: { context: ., dockerfile: docker/api.Dockerfile }
    env_file: .env
    environment:
      # Inside Docker the database and cache are reached by service name, not localhost.
      DATABASE_URL: postgresql://chambelli:chambelli@postgres:5432/chambelli
      REDIS_URL: redis://redis:6379
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
volumes:
  commerce_pg: {}
